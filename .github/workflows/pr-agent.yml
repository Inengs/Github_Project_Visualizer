name: PR Agent

on:
    pull_request:
        types: [opened, reopened, ready_for_review]

jobs:
    pr_agent:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: read

        steps:
            - name: PR Agent
              uses: Codium-ai/pr-agent@main
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
